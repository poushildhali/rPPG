<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake & Liveness Detector</title>
    <style>
        :root { 
            --primary: #4F46E5; 
            --bg: #F3F4F6; 
            --text: #1F2937;
            --tab-inactive: #E5E7EB;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            width: 100%; 
            max-width: 500px; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            overflow: hidden; 
        }
        
        /* --- TABS Styling --- */
        .tabs {
            display: flex;
            background: var(--tab-inactive);
            cursor: pointer;
        }
        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: #6B7280;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            background: white;
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }
        .tab:hover:not(.active) {
            background: #eef2ff;
        }

        /* --- Content Styling --- */
        .content-area {
            padding: 2rem;
            text-align: center;
        }
        
        h2 { margin-top: 0; color: #111827; font-size: 1.5rem; }
        p.desc { color: #6B7280; margin-bottom: 1.5rem; font-size: 0.95rem; }

        .upload-area { 
            border: 2px dashed #D1D5DB; 
            padding: 2.5rem 1rem; 
            border-radius: 0.5rem; 
            cursor: pointer; 
            transition: 0.2s; 
            position: relative; 
            background: #F9FAFB;
        }
        .upload-area:hover { border-color: var(--primary); background: #EEF2FF; }
        .upload-area input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .upload-icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

        .btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 0.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 1.5rem; 
            width: 100%; 
            transition: 0.2s; 
        }
        .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #4338CA; }

        /* --- Result Box --- */
        .result-box { margin-top: 2rem; padding: 1rem; border-radius: 0.5rem; display: none; text-align: left; }
        .result-box.real { background: #ECFDF5; border: 1px solid #10B981; color: #065F46; }
        .result-box.fake { background: #FEF2F2; border: 1px solid #EF4444; color: #991B1B; }
        
        .result-header { font-size: 1.25rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; font-size: 0.9rem; margin-top: 1rem; }
        .stat-row { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* --- Loader --- */
        #loader { display: none; margin-top: 1rem; color: var(--primary); font-weight: 500; }
        .spinner { width: 18px; height: 18px; border: 2px solid #E5E7EB; border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Tab Content Toggling */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('video')">Video Liveness</div>
        <div class="tab" onclick="switchTab('photo')">Photo Forensics</div>
    </div>

    <div class="content-area">
        
        <div id="video-content" class="tab-content active">
            <h2>Video Analysis</h2>
            <p class="desc">Detect heartbeats (rPPG) from video to verify liveness.</p>
            
            <div class="upload-area">
                <input type="file" id="videoInput" accept="video/mp4,video/avi,video/mov,video/mkv" onchange="handleFileSelect('video')">
                <span class="upload-icon">🎥</span>
                <span id="videoFileName">Drop video or Click to Upload</span>
            </div>
            
            <button id="videoBtn" class="btn" onclick="analyze('video')" disabled>Analyze Video</button>
        </div>

        <div id="photo-content" class="tab-content">
            <h2>Photo Analysis</h2>
            <p class="desc">Analyze texture and noise patterns to detect AI generation.</p>
            
            <div class="upload-area">
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" onchange="handleFileSelect('photo')">
                <span class="upload-icon">📷</span>
                <span id="photoFileName">Drop photo or Click to Upload</span>
            </div>
            
            <button id="photoBtn" class="btn" onclick="analyze('photo')" disabled>Analyze Photo</button>
        </div>

        <div id="loader">
            <div class="spinner"></div> Processing...
        </div>

        <div id="resultBox" class="result-box">
            <div class="result-header">
                <span id="resultTitle">REAL</span>
                <span id="resultConf" style="font-size: 0.9em; background: rgba(255,255,255,0.5); padding: 2px 8px; border-radius: 4px;">98%</span>
            </div>
            <div id="statsContent" class="stats-grid"></div>
        </div>

    </div>
</div>

<script>
    let currentTab = 'video';

    function switchTab(tab) {
        currentTab = tab;
        
        // Update Tab UI
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        // Find the index to set active class
        const tabIndex = tab === 'video' ? 0 : 1;
        document.querySelectorAll('.tab')[tabIndex].classList.add('active');
        document.getElementById(tab + '-content').classList.add('active');

        // Reset UI
        document.getElementById('resultBox').style.display = 'none';
    }

    function handleFileSelect(type) {
        const input = document.getElementById(type + 'Input');
        const nameDisplay = document.getElementById(type + 'FileName');
        const btn = document.getElementById(type + 'Btn');

        if (input.files.length > 0) {
            nameDisplay.textContent = input.files[0].name;
            btn.disabled = false;
            document.getElementById('resultBox').style.display = 'none';
        }
    }

    async function analyze(type) {
        const input = document.getElementById(type + 'Input');
        const btn = document.getElementById(type + 'Btn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');

        if (!input.files[0]) return;

        // UI Loading State
        btn.disabled = true;
        loader.style.display = 'block';
        resultBox.style.display = 'none';

        const formData = new FormData();
        formData.append('file', input.files[0]);

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            loader.style.display = 'none';
            btn.disabled = false;

            if (response.ok) {
                showResult(data);
            } else {
                alert(data.error || "Analysis failed");
            }
        } catch (error) {
            loader.style.display = 'none';
            btn.disabled = false;
            alert("Network error. Check console for details.");
            console.error(error);
        }
    }

    function showResult(data) {
        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        
        const isReal = data.result.includes("REAL");
        resultBox.className = "result-box " + (isReal ? "real" : "fake");
        
        document.getElementById('resultTitle').textContent = data.result;
        document.getElementById('resultConf').textContent = data.confidence;

        let statsHtml = "";
        for (const [key, val] of Object.entries(data.stats)) {
            statsHtml += `
                <div class="stat-row">
                    <span>${key}</span>
                    <strong>${val}</strong>
                </div>
            `;
        }
        document.getElementById('statsContent').innerHTML = statsHtml;
    }
</script>

</body>
</html>
